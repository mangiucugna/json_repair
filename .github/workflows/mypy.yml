name: Mypy Type Check

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:

jobs:
  type-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      with:
        activate-environment: true

    - name: Run mypy
      run: uv run --no-default-groups --group typecheck --frozen mypy src/

    - name: Run ty
      run: uv run --no-default-groups --group typecheck --group test --frozen ty check src/ tests/
