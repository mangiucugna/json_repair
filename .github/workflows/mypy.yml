name: Mypy Type Check

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:

jobs:
  type-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
      with:
        activate-environment: true

    - name: Run mypy
      run: uv run --no-default-groups --group typecheck --frozen mypy src/

    - name: Run Pyrefly
      run: uv run --no-default-groups --group typecheck --group test --group schema --frozen pyrefly check
