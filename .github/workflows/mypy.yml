name: Mypy Type Check

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:

jobs:
  type-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      with:
        activate-environment: true

    - name: Run mypy
      run: uv run --no-default-groups --group typecheck --frozen mypy src/

    - name: Run ty
      run: uv run --no-default-groups --group typecheck --group test --frozen ty check src/ tests/
